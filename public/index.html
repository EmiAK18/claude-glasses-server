<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body { 
  font-size: 24px; 
  padding: 20px; 
  font-family: Arial;
  background: white;
}
</style>
</head>
<body>
<div id="text">Lade...</div>
<script>
async function load() {
  const res = await fetch("/answer-text")
  const text = await res.text()
  document.getElementById("text").innerText = text
  setTimeout(load, 3000)
}
load()
</script>
</body>
</html>
