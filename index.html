<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.jsdelivr.net/npm/@evenrealities/even_hub_sdk/dist/index.js"></script>
</head>
<body>
<script>
async function main() {
  const { waitForEvenAppBridge, TextContainerProperty, CreateStartUpPageContainer } = EvenHubSDK;
  const bridge = await waitForEvenAppBridge();

  async function fetchAndDisplay() {
    const res = await fetch("https://claude-glasses-server.onrender.com/answer");
    const data = await res.json();
    const text = data.text;

    const textProp = new TextContainerProperty({
      xPosition: 0,
      yPosition: 0,
      width: 576,
      height: 288,
      borderWidth: 0,
      borderColor: 5,
      paddingLength: 4,
      containerID: 1,
      containerName: "main",
      content: text,
      isEventCapture: 1,
    });

    await bridge.createStartUpPageContainer(
      new CreateStartUpPageContainer({
        containerTotalNum: 1,
        textObject: [textProp],
      })
    );
  }

  await fetchAndDisplay();
  setInterval(fetchAndDisplay, 5000);
}

main();
</script>
</body>
</html>
